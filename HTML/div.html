<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
        ctrl + shift + p
        選擇「使用縮寫換行」
        輸入要使用的標籤
    -->
    <h1>元素分類</h1>
    <ul>
        <li>區塊 block 元素代表:div</li>
        <li>行內 inline 元素代表:span</li>
    </ul>
    <!-- 
        區塊
        在預設的狀態下，永遠都會換行
        常用:h1-h6, p, ul, ol, li, div

        行內
        在預設的狀態下，永遠都會並排
        常用:a, img, span

    -->
    <div>區塊</div>
    <div>區塊</div>
    <div>區塊</div>
    <div>區塊</div>
    <div>區塊</div>
    <span>行內</span>
    <span>行內</span>
    <span>行內</span>
    <span>行內</span>
    <span>行內</span>
</body>
</html>
