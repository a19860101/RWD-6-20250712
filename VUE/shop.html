<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Huninn&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Nunito', 'Huninn';
        }
        img {
            width: 100%;
        }
        .container {
            max-width: 960px;
            margin-inline: auto;
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(240px,1fr));
            grid-auto-rows: 420px;
            gap:25px;
        }
        .product-card {
            display: flex;
            flex-direction: column;
            border: 1px solid #5D688A;
            border-radius: 8px;
            overflow: hidden;
        }
        .product-cover {
            width: 100%;
            padding: 15px;
            img {
                aspect-ratio: 4 / 3;
                height: 100%;
                object-fit: contain;
            }
        }
        .product-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            background-color: #FFF2EF;
            height: 100%;
            .product-info {
                margin-top: auto;
                display: flex;
                justify-content: space-between;
                align-items: center;
                .add_to_cart {
                    padding: 8px 24px;
                    font-size: 14px;
                    background-color: #F7A5A5;
                    border-radius: 6px;
                    text-decoration: none;
                    color: #fff;
                }
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="container">
            <div v-for="p of products" class="product-card">
                <div class="product-cover">
                    <img :src="p.image" alt="">
                </div>
                <div class="product-body">
                    <h3>{{p.title}}</h3>
                    <div class="product-info">
                        <span>
                            $.{{p.price}}
                        </span>
                        <a href="#" class="add_to_cart">Add To Cart</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        Vue.createApp({
            data(){
                return{
                    products:[]
                }
            },
            created(){
                let url = 'https://fakestoreapi.com/products'
                fetch(url).then(res=>res.json())
                .then(data => {
                    this.products = data;
                    console.log(data)
                })
            }
        }).mount('#app')
    </script>    
</body>
</html>
