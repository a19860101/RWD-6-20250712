<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Huninn&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Nunito', 'Huninn';
        }
        img {
            width: 100%;
        }
        .container {
            max-width: 960px;
            margin-inline: auto;
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(240px,1fr));
            grid-auto-rows: 420px;
            gap:25px;
        }
        .product-card {
            display: flex;
            flex-direction: column;
            border: 1px solid #5D688A;
            border-radius: 8px;
            overflow: hidden;
        }
        .product-cover {
            width: 100%;
            padding: 15px;
            img {
                aspect-ratio: 4 / 3;
                height: 100%;
                object-fit: contain;
            }
        }
        .product-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            background-color: #FFF2EF;
            height: 100%;
            .product-info {
                margin-top: auto;
                display: flex;
                justify-content: space-between;
                align-items: center;
                .add_to_cart {
                    padding: 8px 24px;
                    font-size: 14px;
                    background-color: #F7A5A5;
                    border-radius: 6px;
                    text-decoration: none;
                    color: #fff;
                }
            }
        }
        nav {
            width: 100%;
            position: sticky;
            top: 0;
            background-color: #5D688A;
            padding: 25px 15px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            a {
                color: #FFF2EF;
                text-decoration: none;
            }
        }
        .carts {
            background-color: transparent;
            position: fixed;
            inset:0;
            visibility: hidden;
            transition: 500ms;
            .wrapper{
                padding-top: 100px;
                padding-inline: 30px;
                width: 400px;
                height: 100vh;
                background-color: #FFF2EF;
                position: absolute;
                right: 0;
                top: 0;
                translate: 100% 0;
                transition: 500ms;
                .carts-close {
                    color: #5D688A;
                    position: absolute;
                    left: 15px;
                    top: 15px;
                }
            }
            &.active {
                background-color: #000000bd;
                backdrop-filter: blur(3px);
                visibility: visible;
                .wrapper {
                    translate: 0 0;
                }
            }
        }
        .toast-container {
            position: fixed;
            right: 15px;
            bottom: 0;
            width: 350px;
            .toast {
                padding: 15px;
                border: 1px solid #888;
                background-color: #fff;
                border-radius: 4px;
                margin-bottom: 15px;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <nav>
            <a href="#">Shop</a>
            <div>
                <a href="#" @click="isOpen = true"><i class="fa-solid fa-cart-shopping fa-lg"></i></a>
            </div>
        </nav>
        <div class="carts" :class="{active: isOpen}">
            <div class="wrapper">
                <div v-for="(c,idx) of carts">
                    <div>{{c.title}}</div>
                    <div>${{c.price}}</div>
                    <a href="#" @click="remove_item(idx)">移除</a>
                    <hr>
                </div>
                <a href="#" @click="clear_item()" v-if="carts.length > 0">clear</a>
                <div v-if="carts.length > 0">
                    Total: {{total}}
                </div>
                <div v-else>
                    購物車是空的!
                </div>
                <a href="#" class="carts-close" @click="isOpen = false"><i class="fa-solid fa-xmark fa-lg"></i></a>
            </div>
        </div>
        <div class="container">
            <div v-for="p of products" class="product-card">
                <div class="product-cover">
                    <img :src="p.image" alt="">
                </div>
                <div class="product-body">
                    <h3>{{p.title}}</h3>
                    <div class="product-info">
                        <span>
                            $.{{p.price}}
                        </span>
                        <a href="#" class="add_to_cart" @click="add_to_cart(p)">Add To Cart</a>
                    </div>
                </div>
            </div>
        </div>
        <div class="toast-container" v-if="toasts.length > 0">
            <div class="toast" v-for="t of toasts">
                {{t.message}}
            </div>
        </div>
    </div>
    <script>
        Vue.createApp({
            data(){
                return{
                    products:[],
                    carts:[],
                    isOpen: false,
                    toasts:[]
                }
            },
            watch:{
                'carts.length'(newLength, oldLength){
                    if(newLength > oldLength){
                        console.log('您新增了一個商品!')
                        // this.showNotification('您新增了一個商品!')

                        this.showToast('您新增了一個商品!')
                    }
                }
            },
            methods:{
                add_to_cart(p){
                    this.carts.push(p)
                },
                remove_item(idx){
                    if(confirm('確認移除？')){
                        this.carts.splice(idx,1);
                    }
                },
                clear_item(){
                    if(confirm('確認清空？')){
                        this.carts.length = 0;
                    }
                },
                showNotification(message){
                    alert(message)
                },
                showToast(message){
                    const t = {
                        id: Date.now(),
                        // message: message
                        message
                    }
                    this.toasts.push(t)

                    setTimeout(()=>{
                        this.removeToast(t.id)
                    },5000)
                },
                removeToast(id){
                    this.toasts = this.toasts.filter(data=>data.id != id)
                }
            },
            computed:{
                carts_price(){
                    
                    return this.carts.map(data=>data.price);
                },
                total(){
                    if(this.carts.length == 0){
                        return 0
                    }else{

                        return this.carts_price.reduce((a,b)=>a+b);
                    }
                }
            },
            created(){
                let url = 'https://fakestoreapi.com/products'
                fetch(url).then(res=>res.json())
                .then(data => {
                    this.products = data;
                    console.log(data)
                })
            }
        }).mount('#app')
    </script>    
</body>
</html>
