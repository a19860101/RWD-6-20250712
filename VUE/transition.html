<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        .list {
            padding: 15px;
            background-color: #ccc;
            margin-bottom: 15px;
            width: 100%;
        }
        .list-enter-active,.list-leave-active, .list-move {
            transition: all 0.5s;
        }
        /* .list-enter-from, .list-leave-to {
            opacity: 0;
            translate: 100% 0;
        } */
        .list-enter-from {
            opacity: 0;
            translate: -100% 0;
         }
        .list-leave-to {
            opacity: 0;
            translate: 100% 0;
        }
        .list-leave-active {
            position: absolute;
        }

        /* enter-from enter-active enter-to
        leave-from leave-active leave-to */

        /* 
            enter-from enter-active enter-to



            leave-from leave-active leave-to
        */
    </style>
</head>
<body>
    <div id="app">
        <button @click="add()">add</button>
        <hr>
        <div>
            <transition-group name="list" tag="">
                <div v-for="data of datas" class="list" :key="data">
                    {{data}}
                    <a href="#" @click="remove(data)">delete</a>
                </div>
            </transition-group>
        </div>
    </div>
    <script>
        Vue.createApp({
            data(){
                return {
                    datas:[]
                }
            },
            methods:{
                add(){
                    this.datas.push(Date.now())
                },
                remove(id){
                    this.datas = this.datas.filter(data=>data != id)
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
