<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        .panel {
            background-color: #ccc;
            padding: 15px;
        }
        .fade-enter-active,
        .fade-leave-active {
            transition: 300ms;
        }
        .fade-enter-from,
        .fade-leave-to {
            opacity: 0;
            translate: 0 30px
        }
        
    </style>
</head>
<body>
    <div id="app">
        <button @click="isOpen = !isOpen">toggle</button>
        <transition name="fade" tag="div">
            <div class="panel" v-if="isOpen">
                <h2>title</h2>
                <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Architecto nisi, quisquam, officiis ipsa hic numquam ratione, maiores culpa nemo accusantium voluptatem sint illum tempora blanditiis quidem dolore eveniet porro modi.</p>
            </div>
        </transition>
    </div>
    <script>
        Vue.createApp({
            data(){
                return {
                    isOpen: false
                }
            },
        }).mount('#app')
    </script>
</body>
</html>
