<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        .list {
            padding: 15px;
            background-color: #ccc;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div id="app">
        <button @click="add()">add</button>
        <hr>
        <div>
            <div v-for="data of datas" class="list">
                {{data}}
            </div>
        </div>
    </div>
    <script>
        Vue.createApp({
            data(){
                return {
                    datas:[]
                }
            },
            methods:{
                add(){
                    this.datas.push(Date.now())
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
