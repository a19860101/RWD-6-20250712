<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        .panel {
            display: none;
            opacity: 0;
            transition: 500ms allow-discrete;
        }
        .panel.active {
            display: block;
            opacity: 1;
        }
        @starting-style {
            .panel.active {
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <button @click="isOpen = !isOpen">toggle</button>
        <div class="panel" :class="{'active': isOpen}">
            <h2>title</h2>
            <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Architecto nisi, quisquam, officiis ipsa hic numquam ratione, maiores culpa nemo accusantium voluptatem sint illum tempora blanditiis quidem dolore eveniet porro modi.</p>
        </div>
    </div>
    <script>
        Vue.createApp({
            data(){
                return {
                    isOpen: false
                }
            },
        }).mount('#app')
    </script>
</body>
</html>
