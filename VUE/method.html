<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="app">
        <input type="text" v-model="title">
        <a href="#" @click="test()">click</a>
    </div>

    <script>
        Vue.createApp({
            data(){
                return {
                    title: 'hello world!'
                }
            },
            methods:{
                test(){
                    alert(this.title)
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
