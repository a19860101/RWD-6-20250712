<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 100px;
            height: 100px;
            background-color: #fa0;

            position: fixed;
            inset:0;
            margin: auto;

            animation: r 3s infinite;
            animation-timing-function: steps(30);
        }

        @keyframes r {
            to {
                rotate: 360deg;
            }
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
