<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 100px;
            height: 100px;
            background-color: #ea5858;

            transition: background-color 500ms 0s, height 500ms 500ms,width 500ms 1s ;
            /* transition-property: width, height, background-color; */
            /* transition-duration: 500ms; */
            /* transition-delay: 0s, 500ms, 1s; */
            /* transition-timing-function: linear; */
            /* ease, ease-in, ease-out, ease-in-out, linear */
        }
        .box:hover {
            width: 200px;
            height: 200px;
            background-color: #5ea4ff;

            transition: width 500ms 0s, height 500ms 500ms, background-color 500ms 1s;

        }
        /* https://cubic-bezier.com/#.17,.67,.83,.67 */
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
