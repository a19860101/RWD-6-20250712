<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 100px;
            height: 100px;
            background-color: #098;

            /* opacity: 0; */
            /* animation: fade-in 3s forwards; */

            animation: test 3s 3s forwards;
            /* animation-name: test; */
            /* animation-duration: 3s; */
            /* animation-delay: 3s; */
            /* animation-fill-mode: forwards; */
        }

        @keyframes test {
            0% {translate: 0 0}
            50% {translate: 300px 400px}
            100% {translate: 600px 100px}

            /* from{} */
            /* to{} */
        }
        @keyframes fade-in {
            to {
                opacity: 1;
            }
        }
        @keyframes fade-out {
            to {
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
