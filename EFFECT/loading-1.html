<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root {
            --blue: #4a7cfa
        }
        .container {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            grid-auto-rows: 300px;
            gap: 10px;
            
        }
        .grid {
            display: flex;
            background-color: #ccc;
            [class^='loading']{
                margin: auto;
            }
        }
        .loading-1 {
            width: 100px;
            height: 100px;
            background-color: var(--blue);
            margin: auto;

            animation: loading-1 1s infinite alternate;
        }
        .loading-2 {
            width: 100px;
            height: 100px;
            border: 10px solid #eee;
            border-radius: 50%;
            border-left-color:var(--blue);;
            border-right-color:var(--blue);;

            animation: loading-1 1.5s infinite;
        }
        .loading-3 {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: var(--blue);
            animation: loading-3 1s infinite ease-out;
        }
        .loading-4 {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: var(--blue);
            position: relative;
            animation: loading-4 2s infinite;
        }
        .loading-4::after {
            content:'';
            position: absolute;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            translate: 25px 0;
            scale: .5;
            background-color: var(--blue);
        }
        .loading-4::before {
            content:'';
            position: absolute;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            translate: -25px 0;
            scale: .5;
            background-color: var(--blue);
        }
        .loading-5 {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background-color: var(--blue);
            box-shadow: -25px 0 0 0 var(--blue), 25px 0 0 0 var(--blue);

            animation: loading-5 2.1s linear infinite;
        }
        .loading-6 {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background-color: transparent;
            box-shadow: 
                -48px 0 0 0 var(--blue),
                -16px 0 0 0 var(--blue),
                16px 0 0 0 var(--blue), 
                48px 0 0 0 var(--blue);
            animation: loading-6 1s linear infinite;
        }
        @keyframes loading-1 {
            to {
                rotate: 360deg;
            }
        }
        @keyframes loading-2 {
            to {
                rotate: 360deg;
            }
        }
        @keyframes loading-3 {
            from {
                scale:0;
            }
            to {
                scale:1;
                opacity: 0;
            }
        }
        @keyframes loading-4 {
            to {
                rotate: 360deg
            }
        }
        @keyframes loading-5 {
            0% {
                background-color: #999;
                box-shadow: -25px 0 0 0 #999, 25px 0 0 0 #999;
            }
            33.333% {
                background-color: #999;
                box-shadow: -25px 0 0 0 var(--blue), 25px 0 0 0 #999;
            }
            66.666% {
                background-color: var(--blue);
                box-shadow: -25px 0 0 0 #999, 25px 0 0 0 #999;
            }
            100% {
                background-color: #999;
                box-shadow: -25px 0 0 0 #999, 25px 0 0 0 var(--blue);
            }
        }
        @keyframes loading-6 {
            0% {
                box-shadow: 
                -48px 0 0 0px var(--blue),
                -16px 0 0 0 var(--blue),
                16px 0 0 0 var(--blue), 
                48px 0 0 0 var(--blue);
            }
            20% {
                box-shadow: 
                -48px 0 0 -10px transparent,
                -16px 0 0 0 var(--blue),
                16px 0 0 0 var(--blue), 
                48px 0 0 0 var(--blue);
            }
            40% {
                box-shadow: 
                -48px 0 0 0 var(--blue),
                -16px 0 0 -10px transparent,
                16px 0 0 0 var(--blue), 
                48px 0 0 0 var(--blue);
            }
            60% {
                box-shadow: 
                -48px 0 0 0 var(--blue),
                -16px 0 0 0 var(--blue),
                16px 0 0 -10px transparent, 
                48px 0 0 0 var(--blue);
            }
            80% {
                box-shadow: 
                -48px 0 0 0 var(--blue),
                -16px 0 0 0 var(--blue),
                16px 0 0 0 var(--blue), 
                48px 0 0 -10px transparent;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="grid">
            <div class="loading-1"></div>
        </div>
        <div class="grid">
            <div class="loading-2"></div>
        </div>
        <div class="grid">
            <div class="loading-3"></div>
        </div>
        <div class="grid">
            <div class="loading-4"></div>
        </div>
        <div class="grid">
            <div class="loading-5"></div>
        </div>
        <div class="grid">
            <div class="loading-6"></div>
        </div>
    </div>
</body>
</html>
