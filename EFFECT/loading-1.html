<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .loading {
            width: 100px;
            height: 100px;
            background-color: #4a7cfa;
            position: fixed;
            inset: 0;
            margin: auto;

            animation: loading 1s infinite alternate;
        }
        @keyframes loading {
            to {
                rotate: 360deg;
            }
        }
    </style>
</head>
<body>
    <div class="loading"></div>
</body>
</html>
