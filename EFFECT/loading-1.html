<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            
        }
        .loading-1 {
            width: 100px;
            height: 100px;
            background-color: #4a7cfa;
            /* position: fixed; */
            /* inset: 0; */
            /* margin: auto; */

            animation: loading-1 1s infinite alternate;
        }
        .loading-2 {
            width: 100px;
            height: 100px;
            border: 10px solid #eee;
            border-radius: 50%;
            border-left-color:blue;
            border-right-color:blue;

            animation: loading-1 1.5s infinite;
        }
        @keyframes loading-1 {
            to {
                rotate: 360deg;
            }
        }
        @keyframes loading-2 {
            to {
                rotate: 360deg;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loading-1"></div>
        <div class="loading-2"></div>
    </div>
</body>
</html>
