<body>
    <script>
        // 三元運算子 tenary ? :
        let x = '';
        // if(x>0){
        //     console.log('success')
        // }else{

        // }

        // console.log(x > 0 ? 'success':'error');

        // let result = x > 0 ? 'success':'error';
        let result = x > 0 ? 'success':'';
        console.log(result)

        // ?? 空值合併運算子
        // 如果x為空(null, undefined)會顯示10
        console.log(x ?? 10);

        // ||
        // 如果x為null, undefined, 0, '', false會顯示10
        console.log(x || 10);

    </script>
