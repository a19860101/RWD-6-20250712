    <script>

        // 宣告式、陳述式
        // function declaration
        // 具有提升性
        function test(){
            return 100
        }
        // console.log(test())

         // 表達式
        // function expression
        const test2 = function(){
            return 100
        }
        //  console.log(test2())

        function foo(x){
            return x
        }
        console.log(foo(123))

        function area(w,h){
            return w*h
        }
        console.log(area(100,200))

        // function rate(dollar, rate=30){

        const rate = function(dollar, rate=30){
            return dollar / rate
        }

    </script>
