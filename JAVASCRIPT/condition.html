<!DOCTYPE html>
<html lang="en">
<head>

<body>
    <script>
        // 判斷式
        let x = 0;
        /* 
            if(條件){
                動作
            }
        */
        if(x > 0){
            console.log('success')
        }

        /* 
            if(條件){
                動作A
            }else{
                動作B
            }
        */
        if(x > 0){
            console.log('success');
        }else{
            console.log('error')
        }

        /* 
            if(條件A){
                動作A
            }else if(條件B){
                動作B
            }
        
        */
       if(x > 0){
            console.log('大於零');
        }else if(x < 0){
            console.log('小於零')
        }

        /* 
            if(條件A){
                動作A
            }else if(條件B){
                動作B
            }else{
                動作C
            }
        
        */
       if(x > 0){
            console.log('大於零');
        }else if(x < 0){
            console.log('小於零')
        }else{
            console.log('error')
        }


        // switch
        let a = 23;
        switch(a){
            case 0:
                console.log(0);
                break;
            case 10:
                console.log(10);
                break;
            case 100:
                console.log(100);
                break;
        }

        switch(true){
            case a>0:
                console.log('大')
                break;
            case a<0:
                console.log('小')
                break;
        }


        let score = 100;

        if(score > 90){
            console.log('A')
        }else if(score > 80){
            console.log('B')
        }else if(score > 70){
            console.log('C')
        }else{
            console.log('D')
        }

        switch(true){
            case score > 90:
                console.log('A')
                break
            case score > 80:
                console.log('B')
                break
            case score > 70:
                console.log('C')
                break
            
        }

        let result = 2;
        switch(result){
            case 1:
                console.log('Monday')
                break;
            case 2:
                console.log('Tuesday')
                break;
            case 3:
                console.log('Wednesday')
                break;
            case 4:
                console.log('Thursday')
                break;
            case 5:
                console.log('Friday')
                break;
            case 6:
                console.log('Saturday')
                break;
        }
    </script>
