<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 變數 variable
        let a = 10;
        let a1 = 10;
        let a_1 = 10;
        var b = 123;
        console.log(b)
        // 變數命名規則
        // 不可使用特殊符號
        // 不可數字開頭
        // 大小寫有別

        // 常數 constant variable
        const c = 342;
        console.log(c)

        // let vs var
        // 範疇不同
        // let 不可重複宣告

        // var s = 'hello';
        // var s = '123';

        let s = '123';

        console.log(s)

        // let vs const
        // const 不可重新賦值

        const z = 10;
        z = z + 10
        console.log(z)
    </script>
</body>
</html>
