<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 運算子
        
        let a = 10;
        let b = 6;
        // 算術運算子
        console.log(a + b);
        console.log(a - b);
        console.log(a * b);
        console.log(a / b);
        console.log(a % b);

        // 比較運算子
        console.log(a > b);
        console.log(a >= b);
        console.log(a < b);
        console.log(a <= b);
        console.log(a == b);
        console.log(a === b); // 資料與型別皆須相同
        console.log(a != b);

        console.log(10 == 10)
        console.log(10 == '10')
        console.log(10 === '10')

        // 指定運算子 / 賦值運算子

        console.log(a = b) // 6
        console.log(a += b) // 12  a = a + b
        console.log(a -= b) // 6   a = a - b
        console.log(a *= b) // 36  a = a * b
        console.log(a /= b) // 6  a = a / b
        console.log(a %= b) // 0  a = a % b
        console.log(a) // 0

        // 邏輯運算子
        // and or not
        let x = 10;
        let y = -6;
        console.log( x>0 && y>0)
        console.log( x>0 || y>0)
        let z = false;
        console.log(!z)
        // !z為真的情況 0,null,undefined,'',false


        // 遞增遞減
        // console.log(x++)
        // console.log(x)
        // console.log(++x)
        console.log(x--)
        console.log(x)
        console.log(--x)

    </script>
</body>
</html>
