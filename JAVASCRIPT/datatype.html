<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 資料型別

        // 數值 number
        let a = 123.123;
        console.log(typeof a)

        // 字串 string
        let b = 'hello';
        console.log(typeof b)

        // 布林 boolean
        let c = false;
        console.log(typeof c)

        // 未定義 undefined
        let d;
        console.log(typeof d)

        // 空值、空物件 null
        let e = null
        console.log(typeof e)

        // 陣列 array
        let f = [1,2,3,4]
        console.log(typeof f)

        // 物件 object
        let g = {name:'john'}
        console.log(typeof g)

        // 集合 set
        let h = new Set()
        console.log(typeof h)
    </script>
</body>
</html>
