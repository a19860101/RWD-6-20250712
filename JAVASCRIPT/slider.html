<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .slider {
            width: 1200px;
            aspect-ratio: 2 / 1;
            margin-inline: auto;
            position: relative;
            .slider-item {
                position: absolute;
                display: none;
                opacity: 0;
                transition: 500ms allow-discrete;
                &.active {
                    display: block;
                    opacity: 1;
                }
            }
        }
        @starting-style {
            .slider-item.active {
                opacity: 0;
            }
        }


        .slider-nav {
            position: absolute;
            bottom: 0;
            translate: 0 100%;
            display: flex;
            width: 100%;
            justify-content: center;
            gap:30px;
        }
    </style>
</head>
<body>
    <div class="slider">
        <div class="slider-item active">
            <img src="https://picsum.photos/id/13/1200/600" alt="">
        </div>
        <div class="slider-item">
            <img src="https://picsum.photos/id/23/1200/600" alt="">
        </div>
        <div class="slider-item">
            <img src="https://picsum.photos/id/33/1200/600" alt="">
        </div>
        <div class="slider-item">
            <img src="https://picsum.photos/id/43/1200/600" alt="">
        </div>
        <div class="slider-item">
            <img src="https://picsum.photos/id/53/1200/600" alt="">
        </div>
        <div class="slider-item">
            <img src="https://picsum.photos/id/63/1200/600" alt="">
        </div>
        <div class="slider-nav">
            <a href="#" class="slider-prev">prev</a>
            <a href="#" class="slider-next">next</a>
        </div>
    </div>
    <script>
        // 所有輪播物件
        let slider_items = document.querySelectorAll('.slider-item')

        // 輪播物件數量
        let total = slider_items.length;

        // 目前所在的index
        let currentIndex = 0;

        // 切換時間(毫秒)
        let timeout = 5000;

        function slider(){
            
            // if(currentIndex == total - 1){
            //     currentIndex = 0
            // }else{
            //     currentIndex += 1
            // }

            currentIndex = (currentIndex + 1) % total;

            switchImage()
            
        }
        function switchImage(){
            document.querySelector('.slider-item.active').classList.remove('active')
            slider_items[currentIndex].classList.add('active');
        }

        setInterval(slider, timeout)
    </script>
</body>
</html>
