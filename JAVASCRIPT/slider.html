<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <style>
        .slider {
            width: 1200px;
            aspect-ratio: 2 / 1;
            margin-inline: auto;
            position: relative;
            .slider-item {
                position: absolute;
                display: none;
                opacity: 0;
                transition: 500ms allow-discrete;
                &.active {
                    display: block;
                    opacity: 1;
                }
            }
        }
        @starting-style {
            .slider-item.active {
                opacity: 1;
            }
        }


        .slider-nav {
            position: absolute;
            bottom: 0;
            translate: 0 100%;
            display: flex;
            width: 100%;
            justify-content: center;
            gap:30px;
            padding-block:15px;
            a {
                color: #000;
            }
        }
    </style>
</head>
<body>
    <div class="slider">
        <div class="slider-item active">
            <img src="https://picsum.photos/id/13/1200/600" alt="">
        </div>
        <div class="slider-item">
            <img src="https://picsum.photos/id/23/1200/600" alt="">
        </div>
        <div class="slider-item">
            <img src="https://picsum.photos/id/33/1200/600" alt="">
        </div>
        <div class="slider-item">
            <img src="https://picsum.photos/id/43/1200/600" alt="">
        </div>
        <div class="slider-item">
            <img src="https://picsum.photos/id/53/1200/600" alt="">
        </div>
        <div class="slider-item">
            <img src="https://picsum.photos/id/63/1200/600" alt="">
        </div>
        <div class="slider-nav">
            <a href="#" class="slider-prev"><i class="fa-solid fa-circle-chevron-left fa-xl"></i></a>
            <a href="#" class="slider-next"><i class="fa-solid fa-circle-chevron-right fa-xl"></i></a>
        </div>
    </div>
    <script>
        // 所有輪播物件
        let slider_items = document.querySelectorAll('.slider-item')

        // 輪播物件數量
        let total = slider_items.length;

        // 目前所在的index
        let currentIndex = 0;

        // 切換時間(毫秒)
        let timeout = 2000;

        let next = document.querySelector('.slider-next');
        let prev = document.querySelector('.slider-prev');

        next.onclick = function(){
            slider()
        }
        prev.onclick = function(){
            slider(-1)
        }

        function slider(direction){
            
            // if(currentIndex == total - 1){
            //     currentIndex = 0
            // }else{
            //     currentIndex += 1
            // }

            // if(currentIndex == 0){
            //     currentIndex = total - 1
            // }else{
            //     currentIndex -= 1;
            // }
            
            if(direction == -1){
                currentIndex = currentIndex == 0 ? total: currentIndex;
                currentIndex = (currentIndex - 1) % total;
            }else{
                currentIndex = (currentIndex + 1) % total;
            }

            switchImage()
            
        }
        function switchImage(){
            document.querySelector('.slider-item.active').classList.remove('active')
            slider_items[currentIndex].classList.add('active');
        }

        // setInterval(slider, timeout)
    </script>
</body>
</html>
