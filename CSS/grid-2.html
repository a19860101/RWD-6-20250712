<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container {
            width: 1200px;
            margin-inline: auto;

            background-color: #ccc;

            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
        }
        .col {
            background-image:linear-gradient(45deg,#e85a0e,#fa0);
            /* height: 100px; */
            padding: 30px;
        }
        .col:nth-of-type(1){
            background-image:linear-gradient(45deg,#098,#fa0);

            /* grid-column-start: 1; */
            /* grid-column-end: 3;  */
            grid-column: 1 / 3;
            grid-row:1 / 3;
        }
        .col:nth-of-type(2){
            /* grid-column: 3/ 5; */
            grid-column: span 2;
            grid-row: span 3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="col">1</div>
        <div class="col">2</div>
        <div class="col">3</div>
        <div class="col">4</div>
        <div class="col">5</div>
        <div class="col">6</div>
        <div class="col">7</div>
        <div class="col">8</div>
        <div class="col">9</div>
        <div class="col">10</div>
    </div>
</body>
</html>
