<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            height: 2000px;
            background-image: linear-gradient(#55aaff,#005a91);
        }
        .container {
            width: 800px;
            height: 600px;
            background-color: #ccc;
            position: relative;
        }
        .box-1 {
            width: 200px;
            height: 200px;
            background-color: #fa0;

            position: absolute;
            /* left:100px; */
            /* top: 100px; */
            inset:0;
            margin: auto;

            z-index: 22;
        }
        .box-2 {
            width: 200px;
            height: 200px;
            background-color: #57fae7;

            position: absolute;
            right: -100px;
            bottom: -100px;

            z-index: 23;

        }
        .box-3 {
            width: 200px;
            height: 200px;
            background-color: #f00;
            position: fixed;
            left: 50px;
            bottom: 50px;
        }
        .box-4 {
            width: 200px;
            height: 200px;
            background-color: #ff00a6;
            top:0;
            right: 0;
            position: sticky;
            
        }
    </style>
</head>
<body>
    <!-- 
        定位 position
        static 靜態
        relative 相對
        absolute 絕對
        fixed 固定
        sticky 黏性

    -->
    <div class="container">
        <div class="box-1"></div>
        <div class="box-2"></div>
    </div>
    <div class="box-4"></div>
    <div class="box-3"></div>
</body>
</html>
