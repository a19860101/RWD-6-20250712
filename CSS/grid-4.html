<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Huninn&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Nunito','Huninn';
        }
        .container {
            display: grid;
            width: 960px;
            margin-inline: auto;
            grid-template-columns: repeat(6, 1fr);
            grid-auto-rows: 150px;
            grid-auto-flow: dense;
            gap:10px;
        }
        .col {
            background-color: #fa0;
        }
        /* .col:nth-of-type(odd){
            background-color: #098;
            grid-row: span 3;
        }
        .col:nth-of-type(even){
            background-color: pink;
            grid-column: span 2;
        }
        .col:nth-of-type(3n+1){
            background-color: crimson;
            grid-row: span 2;
        } */
        .w-2 {
            grid-column: span 2;
        }
        .w-3 {
            grid-column: span 3;
        }
        .h-2 {
            grid-row: span 2;
        }
        .h-3 {
            grid-row: span 3;
        }
    </style>
</head>
<body>
    <!-- METRO -->
    <div class="container"> 
        <div class="col w-3 h-3">1</div>
        <div class="col w-2">2</div>
        <div class="col h-3">3</div>
        <div class="col w-2 h-3">4</div>
        <div class="col w-3">5</div>
        <div class="col h-2">6</div>
        <div class="col w-2 h-2">7</div>
        <div class="col h-2">8</div>
        <div class="col w-3 h-2">9</div>
        <div class="col">10</div>
        <div class="col">11</div>
        <div class="col h-2">12</div>
        <div class="col w-2 h-2">13</div>
        <div class="col">14</div>
        <div class="col w-2 h-3">15</div>
        <div class="col">16</div>
        <div class="col w-3 h-2">17</div>
        <div class="col">18</div>
        <div class="col h-3">19</div>
        <div class="col w-2 h-3">20</div>
    </div>
</body>
</html>
