<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container {
            width: 1200px;
            margin-inline: auto;

            background-color: #ccc;

            display: grid;
            /* grid-template-columns: 25% 25% 25% 25%; */
            /* grid-template-columns: 1fr 1fr 1fr 1fr; */
            grid-template-columns: repeat(6, 1fr);
            /* grid-template-rows: 100px 100px; */
            gap: 15px;
        }
        .col {
            background-image:linear-gradient(45deg,#e85a0e,#fa0);
            height: 100px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- .col{$}*10 -->
        <div class="col">1</div>
        <div class="col">2</div>
        <div class="col">3</div>
        <div class="col">4</div>
        <div class="col">5</div>
        <div class="col">6</div>
        <div class="col">7</div>
        <div class="col">8</div>
        <div class="col">9</div>
        <div class="col">10</div>
    </div>
</body>
</html>
